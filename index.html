<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icebreaker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Canvas fills as much space as possible while keeping 4:3 (320×240) */
    #c {
      display: block;
      width: min(100vw, calc(100vh * 4 / 3));
      aspect-ratio: 4 / 3;
      image-rendering: pixelated;
      image-rendering: crisp-edges; /* Safari fallback */
    }

    /* ── Start screen ─────────────────────────────────────────────────── */
    #start-screen {
      position: fixed;
      inset: 0;
      background: #07111d;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      font-family: monospace;
      color: #c8e4ff;
    }

    #start-inner {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    #start-inner h1 {
      font-size: clamp(2.2rem, 9vw, 5.5rem);
      letter-spacing: 0.25em;
      color: #a0d4ff;
      text-shadow: 0 0 30px #3388bb, 0 0 60px #1155aa;
    }

    #controls {
      color: #7aadcc;
      font-size: clamp(0.72rem, 1.8vw, 0.95rem);
      line-height: 2.2;
      border: 1px solid #1a3a55;
      padding: 14px 30px;
      background: #0b1e30;
    }

    #controls kbd {
      display: inline-block;
      background: #1a3a55;
      border: 1px solid #336688;
      padding: 1px 6px;
      border-radius: 3px;
      font-family: monospace;
      color: #c8e4ff;
    }

    #start-inner h2 {
      font-size: clamp(0.78rem, 2.2vw, 1.05rem);
      letter-spacing: 0.2em;
      color: #5a9abf;
    }

    #boat-selector {
      display: flex;
      gap: 18px;
    }

    .boat-card {
      width: 110px;
      padding: 14px 10px 12px;
      border: 2px solid #1a3a55;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: #0b1e2e;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }

    .boat-card:hover   { border-color: #4488aa; background: #0f2840; }
    .boat-card.selected { border-color: #88ccff; background: #142d44; }

    .boat-card span {
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      color: #7aadcc;
      text-transform: uppercase;
    }

    /* Top-down boat silhouette */
    .boat-preview {
      width: 54px;
      height: 38px;
      position: relative;
      clip-path: polygon(12% 0%, 88% 0%, 100% 50%, 88% 100%, 12% 100%, 0% 50%);
    }

    .classic-preview { background: #8B4513; }
    .arctic-preview  { background: #cce4f8; }
    .tugboat-preview { background: #CC2200; width: 58px; height: 34px; }

    .boat-preview .cabin {
      position: absolute;
      top: 20%;
      left: 25%;
      width: 38%;
      height: 58%;
    }

    .classic-preview .cabin { background: #F4A460; }
    .arctic-preview  .cabin { background: #1a3a6e; }
    .tugboat-preview .cabin { background: #F5C540; top: 18%; left: 22%; width: 44%; height: 56%; }

    /* ── Mode selector ──────────────────────────────────────────────── */
    #mode-selector {
      display: flex;
      gap: 12px;
    }

    .mode-btn {
      padding: 10px 28px;
      background: #0b1e2e;
      border: 2px solid #1a3a55;
      color: #7aadcc;
      font-family: monospace;
      font-size: clamp(0.72rem, 1.8vw, 0.88rem);
      letter-spacing: 0.18em;
      cursor: pointer;
      text-transform: uppercase;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
      user-select: none;
    }

    .mode-btn:hover    { border-color: #4488aa; background: #0f2840; color: #c8e4ff; }
    .mode-btn.selected { border-color: #88ccff; background: #142d44; color: #c8e4ff; }

    #start-btn {
      padding: 12px 52px;
      background: #0e3a5c;
      border: 2px solid #5aaadd;
      color: #c8e4ff;
      font-family: monospace;
      font-size: clamp(1rem, 3vw, 1.35rem);
      letter-spacing: 0.25em;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      text-transform: uppercase;
    }

    #start-btn:hover  { background: #185880; transform: scale(1.04); }
    #start-btn:active { transform: scale(0.97); }

    /* ── Horn touch button ───────────────────────────────────────────────── */
    #horn-btn {
      display: none; /* shown only on touch devices */
      position: fixed;
      bottom: clamp(16px, 4vw, 32px);
      right:  clamp(16px, 4vw, 32px);
      width:  clamp(60px, 14vw, 88px);
      height: clamp(60px, 14vw, 88px);
      border-radius: 50%;
      background: #0e3a5c;
      border: 3px solid #5aaadd;
      color: #c8e4ff;
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      cursor: pointer;
      z-index: 5;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s, transform 0.1s;
    }
    #horn-btn:active { background: #185880; transform: scale(0.92); }

    /* ── Zoom button & panel ─────────────────────────────────────────────── */
    #zoom-btn {
      display: none; /* shown when game starts */
      position: fixed;
      bottom: clamp(16px, 4vw, 32px);
      right:  calc(clamp(16px, 4vw, 32px) * 2 + clamp(60px, 14vw, 88px));
      width:  clamp(60px, 14vw, 88px);
      height: clamp(60px, 14vw, 88px);
      border-radius: 50%;
      background: #0e3a5c;
      border: 3px solid #5aaadd;
      color: #c8e4ff;
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      cursor: pointer;
      z-index: 5;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s, transform 0.1s;
      align-items: center;
      justify-content: center;
    }
    #zoom-btn:active { background: #185880; transform: scale(0.92); }

    #zoom-panel {
      display: none; /* toggled by zoom-btn */
      position: fixed;
      bottom: calc(clamp(16px, 4vw, 32px) + clamp(60px, 14vw, 88px) + 12px);
      right:  calc(clamp(16px, 4vw, 32px) * 2 + clamp(60px, 14vw, 88px));
      transform: translateX(50%);
      background: #0b1e30;
      border: 2px solid #5aaadd;
      border-radius: 8px;
      padding: 10px 14px;
      z-index: 5;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 140px;
    }
    #zoom-panel label {
      font-family: monospace;
      font-size: 0.75rem;
      color: #7aadcc;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    #zoom-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #1a3a55;
      outline: none;
      cursor: pointer;
    }
    #zoom-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #5aaadd;
      cursor: pointer;
    }
    #zoom-slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #5aaadd;
      cursor: pointer;
      border: none;
    }
    /* ── Mission HUD ─────────────────────────────────────────────── */
    #mission-hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 10px 18px;
      display: none;
      justify-content: space-between;
      align-items: center;
      font-family: monospace;
      font-size: clamp(0.72rem, 2.2vw, 1rem);
      color: #c8e4ff;
      z-index: 4;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(7,17,29,0.75) 0%, transparent 100%);
    }

    #hud-timer {
      letter-spacing: 0.12em;
      font-size: clamp(1rem, 3vw, 1.4rem);
      color: #7fe7cc;
    }

    #hud-score { letter-spacing: 0.12em; }
    #hud-boat  { letter-spacing: 0.1em; color: #7aadcc; }

    /* ── End screen ──────────────────────────────────────────────── */
    #end-screen {
      position: fixed;
      inset: 0;
      background: #07111d;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      z-index: 10;
      font-family: monospace;
      color: #c8e4ff;
    }

    #end-screen h2 {
      font-size: clamp(1.4rem, 5vw, 2.8rem);
      letter-spacing: 0.25em;
      color: #a0d4ff;
      text-shadow: 0 0 30px #3388bb, 0 0 60px #1155aa;
    }

    #final-score {
      font-size: clamp(1.6rem, 5vw, 3rem);
      letter-spacing: 0.2em;
      color: #7fe7cc;
    }

    #menu-btn {
      padding: 12px 52px;
      background: #0e3a5c;
      border: 2px solid #5aaadd;
      color: #c8e4ff;
      font-family: monospace;
      font-size: clamp(0.9rem, 2.5vw, 1.2rem);
      letter-spacing: 0.25em;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      text-transform: uppercase;
    }
    #menu-btn:hover  { background: #185880; transform: scale(1.04); }
    #menu-btn:active { transform: scale(0.97); }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- Start screen overlay -->
  <div id="start-screen">
    <div id="start-inner">
      <h1>ICEBREAKER</h1>

      <div id="controls">
        <div><kbd>↑</kbd> <kbd>↓</kbd> Move &nbsp;&nbsp; <kbd>←</kbd> <kbd>→</kbd> Turn</div>
        <div>Click to navigate &nbsp;&nbsp; <kbd>Space</kbd> Horn</div>
      </div>

      <h2>SELECT VESSEL</h2>

      <div id="boat-selector">
        <div class="boat-card selected" data-type="classic">
          <div class="boat-preview classic-preview"><div class="cabin"></div></div>
          <span>Classic</span>
        </div>
        <div class="boat-card" data-type="arctic">
          <div class="boat-preview arctic-preview"><div class="cabin"></div></div>
          <span>Arctic</span>
        </div>
        <div class="boat-card" data-type="tugboat">
          <div class="boat-preview tugboat-preview"><div class="cabin"></div></div>
          <span>Tugboat</span>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <h2>SELECT MODE</h2>
        <div id="mode-selector">
          <button class="mode-btn" data-mode="freeplay">Freeplay</button>
          <button class="mode-btn selected" data-mode="mission">Get to Work</button>
        </div>
      </div>

      <button id="start-btn">START</button>
    </div>
  </div>

  <!-- Mission HUD (mission mode only) -->
  <div id="mission-hud">
    <div id="hud-timer">1:00</div>
    <div id="hud-boat">BOAT 1 OF 5</div>
    <div id="hud-score">SCORE: 0</div>
  </div>

  <!-- End screen -->
  <div id="end-screen">
    <h2>MISSION COMPLETE</h2>
    <div id="final-score">SCORE: 0</div>
    <button id="menu-btn">MAIN MENU</button>
  </div>

  <canvas id="c"></canvas>
  <button id="horn-btn" aria-label="Horn">📯</button>
  <button id="zoom-btn" aria-label="Zoom">🔍</button>
  <div id="zoom-panel" role="dialog" aria-label="Zoom control">
    <label for="zoom-slider">Zoom</label>
    <input id="zoom-slider" type="range" min="6" max="50" value="12" step="1">
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
